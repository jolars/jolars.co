<svg id="flowchart" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 333.40625px;" viewBox="0 0 333.40625 822.8515625" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-flowchart" aria-labelledby="chart-title-flowchart"><title id="chart-title-flowchart">The new fitting pipeline in Eunoia</title><desc id="chart-desc-flowchart">Run starting layouts in parallel, optimize each layout, and use CMA-ES followed by local optimization if its loss exceeds the threshold. Keep the attempt with the lowest loss.</desc><style>#flowchart{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#flowchart .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#flowchart .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#flowchart .error-icon{fill:#552222;}#flowchart .error-text{fill:#552222;stroke:#552222;}#flowchart .edge-thickness-normal{stroke-width:1px;}#flowchart .edge-thickness-thick{stroke-width:3.5px;}#flowchart .edge-pattern-solid{stroke-dasharray:0;}#flowchart .edge-thickness-invisible{stroke-width:0;fill:none;}#flowchart .edge-pattern-dashed{stroke-dasharray:3;}#flowchart .edge-pattern-dotted{stroke-dasharray:2;}#flowchart .marker{fill:#333333;stroke:#333333;}#flowchart .marker.cross{stroke:#333333;}#flowchart svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#flowchart p{margin:0;}#flowchart .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#flowchart .cluster-label text{fill:#333;}#flowchart .cluster-label span{color:#333;}#flowchart .cluster-label span p{background-color:transparent;}#flowchart .label text,#flowchart span{fill:#333;color:#333;}#flowchart .node rect,#flowc