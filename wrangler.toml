name = "jolars-markdown-negotiation"
main = "workers/markdown-negotiation.mjs"
compatibility_date = "2026-10-04"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "jolars.co"
zone_name = "jolars.co"
custom_domain = true

[[routes]]
pattern = "www.jolars.co"
zone_name = "jolars.co"
custom_domain = true

[assets]
directory = "./_site"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01
